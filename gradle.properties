version = 2.0.0-SNAPSHOT

# Java release the sources are compiled against, passed to javac as --release.
# The Eclipse projects are all set to JavaSE-1.8; override with
# -PjavaVersion=11 to build against a newer release.
javaVersion = 8

org.gradle.parallel = true
org.gradle.caching = false

# Compilation is not forked, so every parallel javac shares the daemon heap, and
# each --release compile reads ct.sym on top of that. Gradle's default 512m runs
# out on a cache-cold build of all projects; the worker cap keeps peak
# concurrency off the core count, which would otherwise be one compile per core.
org.gradle.jvmargs = -Xmx1g
org.gradle.workers.max = 8
